[project]
name = "agentic-software-factory"
version = "0.1.0"
description = "Autonomous multi-agent platform that transforms product requirements into tested, deployable software."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "langgraph>=0.1.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "openai>=1.40.0",
    "litellm>=1.40.0",
    "GitPython>=3.1.40",
    "structlog>=24.1.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "httpx>=0.25.0",
    "orjson>=3.9.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "black>=24.0.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
]

[project.scripts]
factory = "factory.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/factory"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
select = ["E", "F", "B", "I"]

[tool.mypy]
python_version = "3.11"
strict = true
